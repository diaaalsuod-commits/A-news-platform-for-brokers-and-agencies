packages:
  - apps/*
  - packages/*

catalog:
  '@eslint/js': ^10.0.1
  '@nestjs/cli': ^12.0.12
  '@nestjs/common': ^12.4.0
  '@nestjs/core': ^12.4.0
  '@nestjs/event-emitter': 12.0.1
  '@nestjs/platform-express': ^12.4.0
  '@nestjs/testing': ^12.4.0
  '@node-rs/argon2': ^2.2.2
  '@next/eslint-plugin-next': ^16.4.5
  '@swc/core': ^1.16.22
  '@tanstack/react-query': ^5.106.1
  '@testcontainers/postgresql': ^12.2.1
  '@types/express': ^5.0.6
  '@types/jsdom': ^30.0.0
  '@types/node': ^24.19.2
  '@types/nodemailer': ^8.0.2
  '@types/pg': ^8.0.0
  '@types/react': ^19.0.0
  '@types/react-dom': ^19.0.0
  '@types/supertest': ^7.0.0
  bullmq: ^6.7.1
  decimal.js: ^10.6.0
  dompurify: ^3.4.17
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  eslint: ^10.14.0
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-boundaries: ^7.4.2
  ioredis: ^6.0.0
  jsdom: ^30.1.3
  nestjs-pino: ^5.3.1
  next: ^16.4.5
  next-intl: ^4.14.9
  nodemailer: ^10.3.1
  pg: ^8.23.1
  pino: ^10.4.0
  pino-http: ^11.0.0
  pino-pretty: ^13.2.0
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  supertest: ^7.3.1
  testcontainers: ^12.2.1
  turbo: ^2.11.10
  # typescript-eslint supports TypeScript below 6.1, so this stays on 6.0.x.
  typescript: ~6.0.3
  typescript-eslint: ^8.72.1
  unplugin-swc: ^2.0.0
  vitest: ^5.1.0
  zod: ^4.6.7

# No third-party install script runs. Each of these has a prebuilt binary, or its script is only a check.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  - '@isaacs/nonrecursive-glob-match@1.1.0'
  - '@nestjs/cli@12.0.12'
  - '@nestjs/common@12.4.0'
  - '@nestjs/core@12.4.0'
  - '@nestjs/platform-express@12.4.0'
  - '@nestjs/schematics@12.0.13'
  - '@nestjs/testing@12.4.0'
  - minimatch@11.0.5
